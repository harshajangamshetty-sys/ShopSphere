spring.application.name=shopsphere

# Read DB_NAME, DB_USER, DB_PASSWORD from the .env file in the project root
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5433/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Schema comes from Flyway migrations, so Hibernate only checks it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
